name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with staged publishing (npm stage, >= 12)
        run: npm install -g npm@latest
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Stages the version on npmjs.org; a maintainer releases it with
      # `npm stage approve <stage-id>` (2FA) or on npmjs.com.
      - run: npm stage publish .
